name: Actualizar datos del screener

on:
  schedule:
    # Todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tickers.xlsx'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar análisis fundamental
        run: python scripts/analyze.py
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true

      - name: Verificar que data.json fue generado
        run: |
          if [ -f docs/data.json ]; then
            echo "✓ docs/data.json generado correctamente"
            echo "  Tamaño: $(wc -c < docs/data.json) bytes"
            echo "  Fecha: $(date -u)"
          else
            echo "✗ ERROR: docs/data.json no fue generado"
            exit 1
          fi

      - name: Commit y push de data.json
        if: always()
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data.json, nada que commitear"
          else
            git commit -m "bot: actualizar data.json [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin master
            git push origin master
          fi
